# Checks that run on every `git commit`.
#   Turn them on once per clone:   pre-commit install   (make setup does it)
#   Run them on every file:        pre-commit run --all-files
#   Update the pinned versions:    pre-commit autoupdate   (monthly, then commit)
repos:
  # Small, general file checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files  # blocks files over 500 kB (datasets, models)
        exclude: ^uv\.lock$          # lockfiles are big by nature
      - id: detect-private-key

  # Secrets: blocks a commit that contains anything that looks like a key or token.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Ruff from this project's own environment (pinned in uv.lock), so the
  # version is the same as `make lint` and CI.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
